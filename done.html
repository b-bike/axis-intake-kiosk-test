<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Form submitted</title>
  <style>
    body { margin: 0; font: 22px/1.5 system-ui, sans-serif; color: #2b2b2b; background: #faf6e8;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    p { margin: 8px 24px; }
    .small { font-size: 18px; color: #555; }
  </style>
</head>
<body>
  <div>
    <p><strong>Thank you.</strong></p>
    <p id="msg">Checking in&hellip;</p>
    <p class="small" id="fallback" hidden>Please close this tab and let the front desk know.</p>
  </div>
<script>
  // The Microsoft Form's thank-you message links here: done.html?f=<form id from config.js>
  // This page only runs after the patient reached the thank-you screen, i.e. submitted.
  (function () {
    var f = new URLSearchParams(location.search).get("f") || "";
    var msg = { type: "axis-form-submitted", f: f };
    var msgEl = document.getElementById("msg"), fb = document.getElementById("fallback");
    var framed = false;
    try { framed = window.parent !== window; } catch (e) {}
    // Case 1: loaded inside the kiosk's form frame. The kiosk replaces the frame, so no UI needed.
    if (framed) { try { window.parent.postMessage(msg, location.origin); } catch (e) {} }
    // Case 2: opened in its own tab (Microsoft Forms opens links in a new tab). Tell the kiosk tab
    // in this browser, then wait for its acknowledgement so we can say whether it worked.
    var bc = null, acked = false;
    try { bc = new BroadcastChannel("axis-kiosk"); } catch (e) {}
    if (bc) {
      bc.onmessage = function (e) {
        if (e.data && e.data.type === "axis-kiosk-ack" && (!f || e.data.f === f)) {
          acked = true;
          msgEl.textContent = "All set. This tab will close.";
          fb.hidden = true;
          setTimeout(function () {
            try { window.close(); } catch (x) {}
            setTimeout(function () { msgEl.textContent = "All set. You can close this tab and go back to the check-in screen."; }, 800);
          }, 700);
        }
      };
      bc.postMessage(msg);
    }
    if (!framed) setTimeout(function () {
      if (!acked) { msgEl.textContent = "We could not reach the check-in screen."; fb.hidden = false; }
    }, 3000);
  })();
</script>
</body>
</html>
